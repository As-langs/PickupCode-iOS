name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up legacy assets
        run: |
          gh release delete-asset "${{ github.ref_name }}" "-1.0.ipa" --yes || true
          gh release delete-asset "${{ github.ref_name }}" "PickupCode-1.0.ipa" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: 取件快码 ${{ github.ref_name }} 正式发布
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release_assets/PickupCode-1.0.1.ipa
            release_assets/取件快码-1.0.1.ipa
            release_assets/PickupCode_AllInOne_取件快码.shortcut
            release_assets/PickupCode_ID_取件身份码.shortcut
            release_assets/PickupCode_Packages_快递待取.shortcut
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
